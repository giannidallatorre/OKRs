name: "CI: Code Quality & Validation"

on:
    push:
        branches: ["main", "github-actions"]
    pull_request:
        branches: ["main", "github-actions"]

jobs:
    test:
        runs-on: ubuntu-latest

        env:
            # Minimal environment for tests.
            # Note: All external API calls are mocked via @patch decorators in tests.
            # These env vars are kept only for logging/config initialization.
            PYTHONPATH: src
            LOG: INFO

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python 3.10
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
                  pip install pytest pytest-cov

            - name: Run tests
              run: |
                  pytest tests/ --cov=src/egi_okr --cov-report=term-missing
