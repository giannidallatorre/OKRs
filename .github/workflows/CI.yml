name: "CI: Code Quality & Validation"

on:
    push:
        branches: ["main", "github-actions"]
    pull_request:
        branches: ["main", "github-actions"]

jobs:
    test:
        runs-on: ubuntu-latest

        env:
            # Dummy values for tests that might require them (though mocks should handle it)
            # These prevent KeyError in setup phases if mocks aren't hit early enough
            LOG: INFO
            DATE_FROM: "2024/04"
            DATE_TO: "2024/06"
            GOOGLE_SHEET_NAME: "test_sheet"
            JIRA_SERVER_URL: "https://jira.example.com/"
            SERVICE_ACCOUNT_FILE: "dummy.json"

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python 3.10
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
                  pip install pytest pytest-cov

            - name: Run tests
              run: |
                  export PYTHONPATH=$PYTHONPATH:$(pwd)/src
                  pytest tests/ --cov=src/egi_okr --cov-report=term-missing
